name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # weekly: catches changes in Google's icon packs

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Fetch official icon packs (and check icon-map.json against them)
        run: python3 scripts/gcp_drawio.py fetch
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: references/icons.md is up to date
        run: |
          python3 scripts/gcp_drawio.py docs
          git diff --exit-code references/icons.md
