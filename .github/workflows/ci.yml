name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # weekly: catches changes in Google's icon packs

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SKILL: skills/gcp-architecture-diagram
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Fetch official icon packs (and check icon-map.json against them)
        run: python3 $SKILL/scripts/gcp_drawio.py fetch
      - name: Skill folder is self-contained (no repo-only files)
        run: |
          ! ls -A $SKILL | grep -vxE 'SKILL.md|LICENSE|scripts|references|assets|examples'
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: icons.md is up to date
        run: |
          python3 $SKILL/scripts/gcp_drawio.py docs
          git diff --exit-code $SKILL/references/icons.md
